# Render Blueprint
services:
  - type: web
    name: bis-engine
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
    healthCheckPath: /api/health
