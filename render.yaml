# Render Blueprint
services:
  - type: web
    name: bis-engine
    runtime: python
    plan: standard
    buildCommand: pip install -r requirements.txt && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: python -m uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      - key: CORS_ORIGINS
        value: "*"
    healthCheckPath: /api/health
